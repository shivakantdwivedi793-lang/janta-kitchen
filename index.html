<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janta Kitchen - स्वाद की दुनिया</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#fff8f0;color:#222}
header{background:linear-gradient(135deg,#d84315,#ff8f00);color:white;text-align:center;padding:22px 15px}
header h1{margin:0;font-size:30px}header p{margin:6px 0 0;font-size:16px}
.container{max-width:700px;margin:auto;padding:15px}.notice{background:#fff3cd;border-left:5px solid #ff9800;padding:12px;margin-bottom:15px;border-radius:8px;font-size:14px}
.card{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #00000012;display:flex;align-items:center;justify-content:space-between;gap:10px}
.item h3{margin:0 0 5px;font-size:18px}.price{font-weight:bold;color:#d84315}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:50%;background:#ff8f00;color:white;font-size:20px}.qty span{min-width:24px;text-align:center;font-weight:bold}
.summary{background:#fff;border-radius:14px;padding:16px;margin-top:18px;box-shadow:0 2px 10px #00000012}
.row{display:flex;justify-content:space-between;margin:8px 0}.total{font-size:22px;font-weight:bold;border-top:1px solid #ddd;padding-top:10px}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
label{font-weight:bold;font-size:14px}.order{width:100%;padding:15px;border:0;border-radius:10px;background:#25D366;color:white;font-size:18px;font-weight:bold;margin-top:10px}
.small{font-size:13px;color:#666;line-height:1.5}.empty{color:#b71c1c;text-align:center;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🍽️ Janta Kitchen</h1>
<p>स्वाद की दुनिया • घर बैठे ऑर्डर करें</p>
</header>
<div class="container">
<div class="notice">🚚 3 KM तक Delivery • ₹149 या अधिक पर FREE Delivery • ₹149 से कम पर ₹10 Delivery Charge</div>

<div id="menu"></div>

<div class="summary">
<h2>🛒 आपका ऑर्डर</h2>
<div id="cart"></div>
<div class="row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
<div class="row"><span>Delivery</span><span id="delivery">₹0</span></div>
<div class="row total"><span>Total</span><span id="total">₹0</span></div>

<h3>📦 Delivery Details</h3>
<label>नाम</label>
<input id="name" placeholder="अपना नाम लिखें">
<label>मोबाइल नंबर</label>
<input id="phone" type="tel" placeholder="मोबाइल नंबर">
<label>पूरा पता</label>
<textarea id="address" rows="3" placeholder="घर/दुकान का पता, मोहल्ला आदि"></textarea>
<button class="order" onclick="sendOrder()">📲 WhatsApp पर Order करें</button>
<p class="small">Order बटन दबाने पर आपका ऑर्डर WhatsApp पर भेजने के लिए तैयार हो जाएगा।</p>
</div>
</div>

<script>
const menu=[
["Vegetable Momos",25,"🥟"],["Paneer Momos",39,"🥟"],["Chowmein Burger",30,"🍜"],
["Tikki Burger",49,"🍔"],["Sagoda Full",25,"🥣"],["Sagoda Half",15,"🥣"],["Bread Pakoda",12,"🍞"]
];
const cart={};
const menuEl=document.getElementById("menu");
menu.forEach((x,i)=>{
menuEl.innerHTML+=`<div class="card"><div class="item"><h3>${x[2]} ${x[0]}</h3><div class="price">₹${x[1]} / ${x[0]=="Bread Pakoda"?"पीस":"प्लेट"}</div></div>
<div class="qty"><button onclick="change(${i},-1)">−</button><span id="q${i}">0</span><button onclick="change(${i},1)">+</button></div></div>`;
});
function change(i,n){cart[i]=(cart[i]||0)+n;if(cart[i]<0)cart[i]=0;document.getElementById("q"+i).textContent=cart[i];update();}
function update(){
let sub=0, lines=[];
menu.forEach((x,i)=>{if(cart[i]){sub+=x[1]*cart[i];lines.push(`${x[0]} x ${cart[i]} = ₹${x[1]*cart[i]}`)}});
let del=sub===0?0:(sub>=149?0:10), total=sub+del;
document.getElementById("subtotal").textContent="₹"+sub;
document.getElementById("delivery").textContent=del===0?(sub? "FREE":"₹0"):"₹"+del;
document.getElementById("total").textContent="₹"+total;
document.getElementById("cart").innerHTML=lines.length?lines.map(x=>`<div class="row"><span>${x}</span></div>`).join(""):'<div class="empty">अभी कोई आइटम नहीं चुना गया है।</div>';
return {sub,del,total,lines};
}
function sendOrder(){
const c=update(), name=document.getElementById("name").value.trim(), phone=document.getElementById("phone").value.trim(), address=document.getElementById("address").value.trim();
if(!c.lines.length){alert("कृपया पहले कोई आइटम चुनें।");return}
if(!name||!phone||!address){alert("कृपया नाम, मोबाइल नंबर और पूरा पता भरें।");return}
let msg=`*Janta Kitchen - स्वाद की दुनिया*%0A%0A*नया Order*%0A${c.lines.join("%0A")}%0A%0ASubtotal: ₹${c.sub}%0ADelivery: ${c.del===0?"FREE":"₹"+c.del}%0A*Total: ₹${c.total}*%0A%0A*Customer Details*%0Aनाम: ${name}%0Aमोबाइल: ${phone}%0Aपता: ${address}`;
window.open("https://wa.me/918470861474?text="+msg,"_blank");
}
update();
</script>
</body>
</html>
